<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hugo - developpeur full-stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="55%" stop-color="#0c1529"/>
      <stop offset="100%" stop-color="#12204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d8dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <circle cx="1040" cy="40" r="230" fill="url(#glow)"/>
  <circle cx="150" cy="300" r="210" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="112" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">Hugo</text>
    <text x="600" y="172" font-size="21" fill="#9db4dd">Développeur full-stack — Java / Angular · React / Node · Electron</text>

    <g font-size="14" font-weight="600">
      <rect x="320" y="202" width="76" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="358" y="224" fill="#cfe0ff">Java</text>

      <rect x="408" y="202" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="456" y="224" fill="#cfe0ff">Angular</text>

      <rect x="516" y="202" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="581" y="224" fill="#cfe0ff">React / Node</text>

      <rect x="658" y="202" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="713" y="224" fill="#cfe0ff">PostgreSQL</text>

      <rect x="780" y="202" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="830" y="224" fill="#cfe0ff">IA &amp; jeux</text>
    </g>

    <text x="600" y="272" font-size="13" fill="#6f86b3" letter-spacing="2">github.com/Hugodujour</text>
  </g>
</svg>
