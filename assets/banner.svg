<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hugo Dujour - Developpeur Full-Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="55%" stop-color="#0c1529"/>
      <stop offset="100%" stop-color="#12204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d8dff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="1010" cy="70" r="270" fill="url(#glow)"/>
  <circle cx="120" cy="330" r="230" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="138" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="0.5">Hugo Dujour</text>
    <text x="74" y="188" font-size="22" fill="#9db4dd">Développeur full-stack · React / Node · Electron · IA &amp; jeux</text>

    <g font-size="14" font-weight="600">
      <rect x="72" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="128" y="244" fill="#cfe0ff" text-anchor="middle">Full-Stack</text>

      <rect x="196" y="222" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="259" y="244" fill="#cfe0ff" text-anchor="middle">React / Node</text>

      <rect x="334" y="222" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="384" y="244" fill="#cfe0ff" text-anchor="middle">Electron</text>

      <rect x="446" y="222" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="500" y="244" fill="#cfe0ff" text-anchor="middle">IA &amp; jeux</text>
    </g>

    <g>
      <rect x="924" y="86" width="164" height="164" rx="42" fill="url(#accent)" fill-opacity="0.08" stroke="url(#accent)" stroke-width="2"/>
      <text x="1006" y="188" font-size="64" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="2">HD</text>
    </g>

    <text x="1128" y="288" font-size="13" fill="#6f86b3" text-anchor="end" letter-spacing="2.5">BUILD · SHIP · PLAY</text>
    <text x="72" y="288" font-size="13" fill="#6f86b3" letter-spacing="1">github.com/Hugodujour</text>
  </g>
</svg>
